dt: 1 # Time spacing -- ms
t0: 0  # Initial time of acquisition -- ms
tn: 4100  # Final time of acquisition -- ms
ns: 100  # number of sources
nr: 575  # number of receivers
wavelet: ./ricker_fpeak=15_dt=1_tn=4100.bin  # Source wavelet file
src:
  x: [ 0, 11500 ]  # Initial and final source offset -- meters
  z: 0  # Depth of sources -- meters
rec:
  x: [ 0, 11500 ]  # Initial and final receiver offset -- meters
  z: 0  # Depth of receivers -- meters


## Optional
# fpeak: 15  # Ricker Wavelet preak frequency -- Hz